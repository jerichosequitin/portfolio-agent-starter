name: Bug report
description: Report a reproducible problem in the reusable starter
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include API keys, private portfolio content, or provider transcripts.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest steps or public repository that reproduces the issue.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Starter revision
      description: Commit SHA, tag, or date copied
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, Bun version, Node.js version, and hosting provider
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Safe evidence
      description: Sanitized logs, screenshots, or test output with secrets and personal data removed
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched for an existing issue.
          required: true
        - label: I removed secrets, personal data, and private transcripts.
          required: true
        - label: This is not a vulnerability report.
          required: true
